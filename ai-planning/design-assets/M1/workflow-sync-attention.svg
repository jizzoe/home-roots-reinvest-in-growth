<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Sync attention workflow</title><desc id="desc">A locally saved record remains usable while a retry is offered only when it is meaningful.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#16265D"/></marker></defs>
  <rect width="1440" height="500" fill="#FFFEFB"/><text x="56" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#16265D">Connectivity attention: record remains safe on the phone</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g fill="none" stroke="#16265D" stroke-width="3" marker-end="url(#a)"><path d="M327 230H415"/><path d="M655 230H743"/><path d="M983 230H1071"/><path d="M535 298V374H535" stroke-dasharray="8 8"/></g><g font-size="22" font-weight="700" fill="#16265D"><rect x="85" y="169" width="242" height="122" rx="10" fill="#2D7A3D"/><text x="206" y="215" fill="#FFF">Record saved locally</text><text x="206" y="248" font-size="17" font-weight="400" fill="#FFF">Participant can continue working</text><rect x="415" y="169" width="240" height="122" rx="10" fill="#FFF7F5" stroke="#C83E35"/><text x="535" y="215">Needs attention</text><text x="535" y="248" font-size="17" font-weight="400">Could not send yet</text><rect x="743" y="169" width="240" height="122" rx="10" fill="#F2F6F0" stroke="#2D7A3D"/><text x="863" y="215">Retry send</text><text x="863" y="248" font-size="17" font-weight="400">Only when participant taps Retry</text><rect x="1071" y="169" width="242" height="122" rx="10" fill="#F2F6F0" stroke="#2D7A3D"/><text x="1192" y="215">Back to Home</text><text x="1192" y="248" font-size="17" font-weight="400">Show current plain-language status</text><rect x="390" y="374" width="290" height="84" rx="10" fill="#F2F6F0" stroke="#2D7A3D"/><text x="535" y="426">Continue without retrying</text></g></g>
</svg>
